source:
  type: file
  path: data/example.wav
preprocessor:
  type: standard
  target_sample_rate: 16000
  highpass_hz: 80
segmenter:
  type: onset
  method: energy
features:
  type: logmel
  n_mels: 64
  n_frames: 32
model:
  type: hubert
  freeze: true
  unfreeze_last_n: 2
  device: auto
decoder:
  type: ngram_beam
  lm_weight: 1.5
train:
  epochs: 4
  batch_size: 8
  lr: 0.0001
  representation: wave
