[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asce"
version = "0.1.0"
description = "Acoustic Side-Channel Engine: swappable audio pipeline with a keytap analyzer as the first plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "sounddevice>=0.5",
    "pynput>=1.7",
    "librosa>=0.10",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17", "mlflow>=2.14"]
dev = ["pytest>=8"]

[project.scripts]
asce = "asce.cli:main"

[tool.setuptools.packages.find]
include = ["asce*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
