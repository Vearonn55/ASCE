<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCE keytap demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12140f;
      --panel: #1c2018;
      --ink: #e7e2d4;
      --muted: #9aa18c;
      --line: #34392c;
      --accent: #d2f08a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background: var(--bg);
      color: var(--ink);
    }
    header, main { max-width: 960px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    h1 { font-size: 1.6rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
    button {
      font: inherit;
      background: var(--accent);
      color: #1a1c14;
      border: 0;
      padding: 8px 16px;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.5; cursor: default; }
    .actions { display: flex; gap: 8px; }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .status { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    .panels { display: grid; gap: 16px; }
    canvas {
      width: 100%;
      height: 140px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: block;
    }
    #captures {
      background: var(--panel);
      border: 1px solid var(--line);
      min-height: 120px;
      max-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .captures-head {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }
    #keys {
      min-height: 72px;
      max-height: 230px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      padding: 12px;
    }
    .key {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid var(--line);
      padding: 6px 8px;
      min-width: 2.2rem;
      text-align: center;
    }
    .key small { display: block; color: var(--muted); font-size: 0.7rem; }
    p.note { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <header>
    <h1>ASCE keytap</h1>
    <div class="actions">
      <button id="toggle" type="button">Start</button>
      <button id="close" class="ghost" type="button">Close</button>
    </div>
  </header>
  <main>
    <p class="status" id="status">Idle. Audio stays in the browser until you start, then it is sent to the local Python worker.</p>
    <div class="panels">
      <canvas id="wave" width="960" height="140"></canvas>
      <canvas id="spec" width="960" height="140"></canvas>
      <div id="captures">
        <div class="captures-head">
          <span>Captures</span>
          <span id="capture-count">0</span>
        </div>
        <div id="keys"></div>
      </div>
    </div>
    <p class="note" id="mode"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
